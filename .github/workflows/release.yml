name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail
          PUB_VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')"
          PUB_NAME="${PUB_VERSION%%+*}"
          EXPECTED_TAG="v${PUB_NAME}"
          echo "pubspec version: $PUB_VERSION (tag must be $EXPECTED_TAG, got ${GITHUB_REF_NAME})"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${PUB_VERSION} (expected ${EXPECTED_TAG}). Update pubspec.yaml or retag."
            exit 1
          fi
          echo "PUB_VERSION=${PUB_VERSION}" >> "$GITHUB_ENV"
          echo "PUB_NAME=${PUB_NAME}" >> "$GITHUB_ENV"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. See README.md \"GitHub Secrets\" section."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs (split per ABI)
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Checksums + rename
        shell: bash
        run: |
          set -euo pipefail
          ls -la build/app/outputs/flutter-apk/
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            base="$(basename "$f" .apk)"
            cp "$f" "dist/matrix-todo-${PUB_NAME}-${base}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Matrix Todo ${{ env.PUB_VERSION }} (Android).

            Install: download the APK matching your device ABI (`arm64-v8a` for most modern phones) and sideload it. Enable "Install unknown apps" when prompted.

            iOS is not distributed as a binary (no paid Apple Developer account). Build from source on a Mac: `flutter run`.
